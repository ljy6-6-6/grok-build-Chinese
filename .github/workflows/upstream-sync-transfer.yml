name: Upstream sync snapshot

on:
  push:
    branches: [sync/upstream-1.0.24]
    paths: [.github/workflows/upstream-sync-transfer.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'JoyElliot/grok-build-Chinese' && github.ref == 'refs/heads/sync/upstream-1.0.24'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare fixed Git history and conflict report
        shell: bash
        run: |
          set -euo pipefail
          base=fde4a35edd815dd7e92d867611f1bc07ecd69724
          upstream=37949780c144e37df692e3d669051a21fec24f20
          git fetch --no-tags https://github.com/xai-org/grok-build.git "$upstream"
          test "$(git rev-parse FETCH_HEAD)" = "$upstream"
          test "$(git merge-base "$base" "$upstream")" = 72a61251fcffb464bcc687aeb5a998e5a98ec0c9
          git update-ref refs/sync-audit/base "$base"
          git update-ref refs/sync-audit/upstream "$upstream"
          mkdir -p "$RUNNER_TEMP/sync-snapshot"
          git bundle create "$RUNNER_TEMP/sync-snapshot/source.bundle" HEAD refs/sync-audit/base refs/sync-audit/upstream
          git bundle verify "$RUNNER_TEMP/sync-snapshot/source.bundle"
          git diff --stat "$base...$upstream" > "$RUNNER_TEMP/sync-snapshot/upstream-stat.txt"
          set +e
          git merge-tree --write-tree "$base" "$upstream" > "$RUNNER_TEMP/sync-snapshot/merge-report.txt"
          result=$?
          set -e
          test "$result" -le 1
          echo "merge-tree exit status: $result" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$RUNNER_TEMP/sync-snapshot/source.bundle" | tee "$RUNNER_TEMP/sync-snapshot/source.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-sync-source-${{ github.run_id }}
          path: ${{ runner.temp }}/sync-snapshot/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
